Class {
        name = "Local";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxlinks = 100;
};

# maxflood above the CLIENT_FLOOD default (1024) => flood-exempt from throttling.
Class {
        name = "Exempt";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxflood = 262144;
        maxlinks = 100;
};

# Deliberately tiny sendq so tests can force list_next_channels() (m_list.c/
# hash.c) to pause mid-LIST and resume on a later event-loop tick without
# needing hundreds of channels -- see labeled_response/test_list_pause.py.
# Flood-exempt (maxflood above the CLIENT_FLOOD default, same threshold the
# "Exempt" class above uses) so the JOINs needed to set up those channels
# aren't slowed by the ~2s-per-command flood penalty -- sendq and maxflood
# are independent knobs, so this doesn't affect the pause behavior itself.
Class {
        name = "TinySendQ";
        pingfreq = 1 minutes 30 seconds;
        sendq = 3000;
        maxflood = 262144;
        maxlinks = 20;
};

# username = "ident" enables DoIdentLookups globally (any non-empty Client
# username mask does).  Failed/skipped ident then gets a leading ~, including
# on cloudflare = yes ports that never query ident.  The companion Client
# without username still accepts clients after a failed lookup.
Client { ip = "*"; class = "Local"; username = "ident"; maxlinks = 50; };
Client { ip = "*"; class = "Local"; maxlinks = 50; };
# Connections on the exempt WebSocket port (7002) are flood-exempt. Defined
# last so it is matched first (Client blocks are checked in reverse order).
Client { ip = "*"; port = 7002; class = "Exempt"; maxlinks = 50; };
# Dedicated tiny-sendq port (6695), see Class "TinySendQ" above.
Client { ip = "*"; port = 6695; class = "TinySendQ"; maxlinks = 20; };

# Forces ~ on USER names for trust-username (+x display) tests.  Independent
# of DoIdentLookups; disable both when testing "ident off => no tilde".
IAuth { program = "/opt/ircu/bin/iauth-tilded.pl"; };

Operator {
        local = no;
        class = "Local";
        host = "*@*";
        password = "$PLAIN$operpass";
        name = "testoper";
        set = yes;
        wide_gline = yes;
};

Port { server = yes; port = 4400; };
Port { port = 6667; };
Port { websocket = yes; port = 7000; };
Port { websocket = yes; cloudflare = yes; port = 7001; };
# Exempt WebSocket port: connections here land in the Exempt class.
Port { websocket = yes; port = 7002; };
# Tiny-sendq port: connections here land in the TinySendQ class.
Port { port = 6695; };

Features {
        "HUB" = "TRUE";
        "NODNS" = "TRUE";
        "CONFIG_OPERCMDS" = "TRUE";
        "CHANNELLEN" = "50";
        "MAXCHANNELSPERUSER" = "20";
        "CAP_MESSAGE_TAGS" = "TRUE";
        "CAP_SERVER_TIME" = "TRUE";
        "CAP_ACCOUNT_TAG" = "TRUE";
        "CLIENTTAGDENY" = "*,-example.com/foo";
# Long suites open many clients from one host; keep clone checks permissive.
        "IPCHECK_CLONE_LIMIT" = "1000";
        "HOST_HIDING" = "TRUE";
        "TRUST_USERNAME" = "TRUE";
        "IPCHECK_CLONE_PERIOD" = "1";
# check_pings() wakes at min(PINGFREQUENCY, …); keep this low so WS keepalive
# tests are not blocked for 120s when the hub has no other local clients.
        "PINGFREQUENCY" = "3";
# RFC6455 server Ping interval for WebSocket ports (see readme.features)
        "WEBSOCKET_KEEPALIVE" = "2";
};
