General {
        name = "acct-hub.test.net";
        vhost = "0.0.0.0";
        description = "Account Resume Test Hub";
        numeric = 30;
        tls certfile = "certs/hub.pem";
        tls keyfile = "certs/hub.key";
};

Admin {
        Location = "Test Network";
        Location = "Account Hub";
        Contact = "test@test.net";
};

Class {
        name = "Local";
        pingfreq = 1 minutes 30 seconds;
        sendq = 160000;
        maxlinks = 100;
};

Client { ip = "*"; class = "Local"; };

# Login-on-connect: every client is logged into an account named after its
# USER username, so account-based resume reattach can be exercised.
IAuth { program = "/usr/bin/perl" "/opt/ircu/lib/iauth-loc-stub.pl"; };

Port {
        port = 6710;
        websocket = yes;
        tls = yes;
        tls systemca = no;
};

Features {
        "NODNS" = "TRUE";
        "TLS_SYSTEMCA" = "FALSE";
        "PPATH" = "ircd-acct-hub.pid";
        "RESUME" = "TRUE";
        "RESUME_TIMEOUT" = "10";
};
